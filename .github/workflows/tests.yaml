name: test

on:
  push:
  pull_request:
    branches: [ "canon" ]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        image:
        - python:3.9-slim
        - python:rc-slim
        - python:3.10-slim
        - python:3.11-slim
        - python:3.12-slim
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      env:
        POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          $HOME/.local/poetry install
      - name: run tests
        run: |
          .venv/bin/pytest --verbose
